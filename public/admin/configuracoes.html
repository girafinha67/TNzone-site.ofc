<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurações — Admin TN Zone</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Configurações</h1>
        <div class="sub">Contato e segurança da conta. Nome da loja, logo e banner ficam em <a href="/admin/pagina-inicial" style="color:var(--blue-bright);">Página inicial</a>.</div>
      </div>
    </div>

    <div class="panel glass" style="max-width:600px;">
      <h3>Contato</h3>
      <div class="sub" style="margin-bottom:16px;">O WhatsApp é o canal principal de vendas; o Instagram é usado para acompanhar novidades e bastidores.</div>
      <form id="settings-form">
        <div class="field"><label>Número de WhatsApp (com DDI e DDD, só números)</label><input type="text" id="s-whatsapp" placeholder="5561986553995"></div>
        <div class="field"><label>Instagram</label><input type="text" id="s-instagram" placeholder="@tnzone"></div>
        <div class="field"><label>E-mail de contato</label><input type="email" id="s-email"></div>
        <button type="submit" class="btn btn-primary">Salvar configurações</button>
      </form>
    </div>

    <div class="panel glass" style="max-width:600px;">
      <h3>Alterar senha</h3>
      <div id="pw-error" class="form-error" style="display:none;"></div>
      <form id="password-form">
        <div class="field"><label>Senha atual</label><input type="password" id="pw-current" required></div>
        <div class="field"><label>Nova senha (mínimo 8 caracteres)</label><input type="password" id="pw-new" required minlength="8"></div>
        <button type="submit" class="btn btn-primary">Atualizar senha</button>
      </form>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/admin/admin-shell.js"></script>
<script>
async function load() {
  const admin = await initAdminPage('/admin/configuracoes');
  if (!admin) return;

  const { settings } = await API.get('/api/settings');
  document.getElementById('s-whatsapp').value = settings.whatsapp_number || '';
  document.getElementById('s-instagram').value = settings.instagram || '';
  document.getElementById('s-email').value = settings.email_contact || '';

  document.getElementById('settings-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await API.put('/api/admin/settings', {
        whatsapp_number: document.getElementById('s-whatsapp').value.replace(/\D/g, ''),
        instagram: document.getElementById('s-instagram').value.trim(),
        email_contact: document.getElementById('s-email').value.trim(),
      });
      toast('Configurações salvas.');
    } catch (err) { toast(err.message, 'error'); }
  });

  document.getElementById('password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('pw-error');
    errBox.style.display = 'none';
    try {
      await API.post('/api/auth/change-password', {
        currentPassword: document.getElementById('pw-current').value,
        newPassword: document.getElementById('pw-new').value,
      });
      toast('Senha atualizada com sucesso.');
      e.target.reset();
    } catch (err) {
      errBox.textContent = err.message;
      errBox.style.display = 'block';
    }
  });
}

load();
</script>
</body>
</html>
