[build]
  publish = "public"
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Pretty URLs (/catalogo -> /catalogo.html, /admin -> /admin/index.html) já são
# resolvidas automaticamente pelo Netlify.

# Headers de segurança aplicados a todas as respostas do site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Páginas /admin/* nunca devem ser indexadas nem cacheadas por proxies/CDN
# intermediários (evita servir uma sessão antiga de outro navegador).
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Reconcilia pagamentos pendentes diretamente na API do PicPay. Horário em UTC.
[functions."reconcile-payments"]
  schedule = "*/10 * * * *"
