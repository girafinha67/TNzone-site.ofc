<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — TNzone</title>
<meta name="description" content="Catálogo completo de tênis, camisas e calças da TNzone. Filtre por categoria, tamanho e preço, e compre direto pelo WhatsApp.">
<meta property="og:title" content="Catálogo — TNzone">
<meta property="og:description" content="Tênis, camisas e calças selecionados. Filtre por categoria, tamanho e preço.">
<meta property="og:image" content="/img/og.jpg">
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="container">
  <div class="section" style="padding-bottom:20px;">
    <div class="section-head">
      <div>
        <h2>Catálogo</h2>
        <div class="sub" id="result-count">Carregando produtos...</div>
      </div>
    </div>

    <div class="filters-bar glass" style="padding:14px 16px;">
      <div class="search-input">
        🔎 <input type="text" id="f-search" placeholder="Buscar produto...">
      </div>
      <select id="f-category"><option value="">Todas as categorias</option></select>
      <select id="f-type">
        <option value="">Todos os tipos</option>
        <option value="tenis">Tênis</option>
        <option value="camisa">Camisas</option>
        <option value="calca">Calças</option>
        <option value="outro">Outros</option>
      </select>
      <select id="f-size"><option value="">Todos os tamanhos</option></select>
      <select id="f-price">
        <option value="">Qualquer preço</option>
        <option value="0-150">Até R$ 150</option>
        <option value="150-300">R$ 150 – R$ 300</option>
        <option value="300-600">R$ 300 – R$ 600</option>
        <option value="600-99999">Acima de R$ 600</option>
      </select>
      <select id="f-stock">
        <option value="">Todos</option>
        <option value="1">Somente em estoque</option>
      </select>
      <select id="f-sort">
        <option value="recent">Mais recentes</option>
        <option value="price-asc">Menor preço</option>
        <option value="price-desc">Maior preço</option>
        <option value="featured">Destaque</option>
      </select>
      <button type="button" id="clear-filters" class="btn btn-ghost btn-sm" style="display:none;">Limpar filtros</button>
    </div>
  </div>

  <div class="product-grid" id="catalog-grid" style="padding-bottom:60px;"></div>
</div>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/product-card.js"></script>
<script>
const params = new URLSearchParams(location.search);
let allSizes = new Set();

async function init() {
  renderLayout('catalogo');

  try {
    const { categories } = await API.get('/api/categories');
    const sel = document.getElementById('f-category');
    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.slug; opt.textContent = c.name;
      sel.appendChild(opt);
    });
  } catch {}

  if (params.get('category')) document.getElementById('f-category').value = params.get('category');
  if (params.get('type')) document.getElementById('f-type').value = params.get('type');

  ['f-search', 'f-category', 'f-type', 'f-size', 'f-price', 'f-stock', 'f-sort'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener(id === 'f-search' ? 'input' : 'change', debounce(loadProducts, 250));
  });

  document.getElementById('clear-filters').addEventListener('click', () => {
    document.getElementById('f-search').value = '';
    document.getElementById('f-category').value = '';
    document.getElementById('f-type').value = '';
    document.getElementById('f-size').value = '';
    document.getElementById('f-price').value = '';
    document.getElementById('f-stock').value = '';
    document.getElementById('f-sort').value = 'recent';
    history.replaceState(null, '', location.pathname);
    loadProducts();
  });

  loadProducts();
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function hasActiveFilters() {
  return Boolean(
    document.getElementById('f-search').value.trim() ||
    document.getElementById('f-category').value ||
    document.getElementById('f-type').value ||
    document.getElementById('f-size').value ||
    document.getElementById('f-price').value ||
    document.getElementById('f-stock').value
  );
}

function sortProducts(products, sort) {
  const list = [...products];
  if (sort === 'price-asc') list.sort((a, b) => (a.promo_price || a.price) - (b.promo_price || b.price));
  else if (sort === 'price-desc') list.sort((a, b) => (b.promo_price || b.price) - (a.promo_price || a.price));
  else if (sort === 'featured') list.sort((a, b) => Number(b.featured) - Number(a.featured));
  // 'recent' já vem ordenado por created_at DESC da API.
  return list;
}

async function loadProducts() {
  const q = new URLSearchParams();
  const search = document.getElementById('f-search').value.trim();
  const category = document.getElementById('f-category').value;
  const type = document.getElementById('f-type').value;
  const size = document.getElementById('f-size').value;
  const price = document.getElementById('f-price').value;
  const stock = document.getElementById('f-stock').value;
  const sort = document.getElementById('f-sort').value;
  if (params.get('featured')) q.set('featured', '1');

  if (search) q.set('q', search);
  if (category) q.set('category', category);
  if (type) q.set('type', type);
  if (size) q.set('size', size);
  if (stock) q.set('inStock', stock);
  if (price) {
    const [min, max] = price.split('-');
    q.set('minPrice', min); q.set('maxPrice', max);
  }

  document.getElementById('clear-filters').style.display = hasActiveFilters() ? '' : 'none';

  try {
    const { products: rawProducts } = await API.get(`/api/products?${q.toString()}`);
    const products = sortProducts(rawProducts, sort);

    products.forEach(p => (p.sizes || []).forEach(s => allSizes.add(s)));
    const sizeSel = document.getElementById('f-size');
    if (sizeSel.options.length <= 1) {
      [...allSizes].sort().forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        sizeSel.appendChild(opt);
      });
    }

    document.getElementById('result-count').textContent = `${products.length} produto${products.length === 1 ? '' : 's'} encontrado${products.length === 1 ? '' : 's'}`;
    renderProductGrid('catalog-grid', products);
  } catch (e) {
    document.getElementById('result-count').textContent = 'Não foi possível carregar os produtos.';
  }
}

init();
subscribeRealtime(() => loadProducts());
</script>
</body>
</html>
