<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedbacks — Admin TN Zone</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Feedbacks</h1>
        <div class="sub">Modere as avaliações antes que apareçam no site.</div>
      </div>
    </div>

    <div class="filters-bar glass" style="padding:10px 14px;width:fit-content;">
      <select id="status-filter">
        <option value="pending">Pendentes</option>
        <option value="approved">Aprovados</option>
        <option value="rejected">Reprovados</option>
        <option value="">Todos</option>
      </select>
    </div>

    <div class="panel glass">
      <table class="admin-table">
        <thead><tr><th>Nome</th><th>Nota</th><th>Comentário</th><th>Produto</th><th>Status</th><th></th></tr></thead>
        <tbody id="fb-tbody"><tr><td colspan="6">Carregando...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/admin/admin-shell.js"></script>
<script>
async function load() {
  const admin = await initAdminPage('/admin/feedbacks');
  if (!admin) return;
  document.getElementById('status-filter').addEventListener('change', loadFeedbacks);
  loadFeedbacks();
}

async function loadFeedbacks() {
  const status = document.getElementById('status-filter').value;
  const { feedbacks } = await API.get(`/api/admin/feedbacks${status ? `?status=${status}` : ''}`);
  const tbody = document.getElementById('fb-tbody');
  if (!feedbacks.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="color:var(--text-faint);">Nenhum feedback aqui.</td></tr>';
    return;
  }
  tbody.innerHTML = feedbacks.map(f => `
    <tr>
      <td>${escapeHtml(f.name)}</td>
      <td>${'★'.repeat(f.rating)}${'☆'.repeat(5 - f.rating)}</td>
      <td style="max-width:280px;">${escapeHtml(f.comment || '—')}</td>
      <td>${f.product_name ? escapeHtml(f.product_name) : '—'}</td>
      <td><span class="pill ${f.status}">${{ pending: 'Pendente', approved: 'Aprovado', rejected: 'Reprovado' }[f.status]}</span></td>
      <td>
        <div class="row-actions">
          ${f.status !== 'approved' ? `<button class="icon-btn" title="Aprovar" onclick="setStatus(${f.id}, 'approved')">✓</button>` : ''}
          ${f.status !== 'rejected' ? `<button class="icon-btn" title="Reprovar" onclick="setStatus(${f.id}, 'rejected')">✕</button>` : ''}
          <button class="icon-btn danger" title="Excluir" onclick="removeFeedback(${f.id})">🗑</button>
        </div>
      </td>
    </tr>
  `).join('');
}

async function setStatus(id, status) {
  try {
    await API.patch(`/api/admin/feedbacks/${id}`, { status });
    toast('Feedback atualizado.');
    loadFeedbacks();
  } catch (err) { toast(err.message, 'error'); }
}

async function removeFeedback(id) {
  const ok = await adminConfirm('Excluir este feedback? Esta ação não pode ser desfeita.', { title: 'Excluir feedback', confirmLabel: 'Excluir' });
  if (!ok) return;
  try {
    await API.del(`/api/admin/feedbacks/${id}`);
    toast('Feedback excluído.');
    loadFeedbacks();
  } catch (err) { toast(err.message, 'error'); }
}

load();
</script>
</body>
</html>
