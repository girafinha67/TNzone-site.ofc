<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Login administrativo | TN'zone</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0a0a'/%3E%3Ctext x='50' y='68' font-size='60' fill='white' text-anchor='middle' font-family='Arial'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../css/catalogo.css">
<link rel="stylesheet" href="../css/admin-mobile.css">
</head>
<body class="admin-body">

<a href="../index.html" class="back-btn" aria-label="Voltar para o site">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</a>

<div class="login-shell">
  <div class="login-card">
    <div class="admin-logo">
      
      <span>TN'zone <em style="color:var(--gold-bright); font-style:normal;">Admin</em></span>
    </div>
    <p class="sub">Acesso só para administradores</p>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm">
      <div class="form-field full">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="form-field full">
        <label for="password">Senha</label>
        <div class="password-field">
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar senha">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.4 21.4 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.4 21.4 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>
      <label class="checkbox-row" style="margin-bottom:22px; color:var(--grey); font-size:0.85rem;">
        <input type="checkbox" id="remember" checked>
        Lembrar deste dispositivo por 30 dias
      </label>
      <button type="submit" class="btn btn-gold btn-block" id="submitBtn">Entrar</button>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
(function () {
  'use strict';
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('loginError');
  const submitBtn = document.getElementById('submitBtn');

  // Se já existe uma sessão válida (dispositivo confiável), pula direto pro painel.
  window.RshoesApi.get('/auth/me').then(() => { window.location.href = 'index.html'; }).catch(() => {});

  const passwordInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePassword');
  toggleBtn.addEventListener('click', () => {
    const showing = passwordInput.type === 'text';
    passwordInput.type = showing ? 'password' : 'text';
    toggleBtn.querySelector('.eye-open').style.display = showing ? '' : 'none';
    toggleBtn.querySelector('.eye-closed').style.display = showing ? 'none' : '';
    toggleBtn.setAttribute('aria-label', showing ? 'Mostrar senha' : 'Ocultar senha');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Entrando...';
    try {
      await window.RshoesApi.post('/auth/login', {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        remember: document.getElementById('remember').checked,
      });
      window.location.href = 'index.html';
    } catch (err) {
      errorBox.textContent = err.message || 'Não foi possível entrar.';
      errorBox.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar';
    }
  });
})();
</script>
</body>
</html>
