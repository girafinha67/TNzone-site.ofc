<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Feedbacks | Painel TN'zone</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0a0a'/%3E%3Ctext x='50' y='68' font-size='60' fill='white' text-anchor='middle' font-family='Arial'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../css/catalogo.css">
<link rel="stylesheet" href="../css/admin-mobile.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-logo">
      <span>TN'zone <em style="color:var(--gold-bright); font-style:normal;">Admin</em></span>
    </div>
    <nav class="admin-nav">
      <a href="index.html">Dashboard</a>
      <a href="produtos.html">Produtos</a>
      <a href="categorias.html">Categorias</a>
      <a href="feedbacks.html" class="active">Feedbacks</a>
      <a href="analytics.html">Análise de usuários</a>
      <a href="conteudo.html">Conteúdo da Home</a>
      <a href="#" id="logoutBtn">Sair</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Feedbacks de clientes</h1>
      <span class="admin-email" id="adminEmail"></span>
    </div>

    <div class="admin-toolbar" id="fbTabs">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn btn-gold" data-status="pending">Pendentes <span id="cnt-pending"></span></button>
        <button type="button" class="btn btn-ghost" data-status="approved">Aprovados <span id="cnt-approved"></span></button>
        <button type="button" class="btn btn-ghost" data-status="rejected">Rejeitados <span id="cnt-rejected"></span></button>
        <button type="button" class="btn btn-ghost" data-status="">Todos</button>
      </div>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Mídia</th><th>Nome completo</th><th>Produto</th><th>Data da compra</th><th>Enviado em</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody id="fbBody"><tr><td colspan="7">Carregando...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/admin-common.js"></script>
<script src="../js/admin-feedbacks.js"></script>
</body>
</html>
