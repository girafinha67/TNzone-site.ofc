<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | TN'zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--paper:#fff;--surface:#f2f2ef;--line:#deddd6;--mute:#707069;--ok:#176b42;box-sizing:border-box}
*{box-sizing:inherit}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}a{color:inherit;text-decoration:none}
.wrap{max-width:980px;margin:auto;padding:24px}header{border-bottom:1px solid var(--line)}header .wrap{display:flex;justify-content:space-between;align-items:center}.logo{font:700 1.25rem "Space Grotesk";display:inline-flex;align-items:center}.logo-img{height:28px}
main{padding:60px 0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:32px}.box{border:1px solid var(--line);padding:26px;background:#fff}.box h1,.box h2{font-family:"Space Grotesk";margin-top:0}.product{display:flex;gap:16px;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line)}.product img{width:100px;height:100px;object-fit:cover;background:var(--surface)}.price{font:700 1.2rem "Space Grotesk"}label{display:block;font-size:.78rem;color:var(--mute);margin:15px 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);padding:13px;font:inherit;background:#fff}textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{width:100%;border:0;background:var(--ink);color:#fff;padding:15px;font:700 .9rem "Space Grotesk";cursor:pointer;margin-top:20px}.msg{padding:15px;margin-top:16px;background:var(--surface);display:none}.success{border:1px solid #b7d7c6;background:#f1faf5;color:var(--ok)}.pix{text-align:center}.pix img{width:260px;max-width:100%;margin:15px auto}.copy{background:#fff;color:var(--ink);border:1px solid var(--line);word-break:break-all;text-align:left}.hidden{display:none!important}.status{font:700 1.1rem "Space Grotesk";margin:10px 0}.cart-item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.cart-item img{width:64px;height:64px;object-fit:cover;background:var(--surface)}.cart-item small{color:var(--mute)}@media(max-width:760px){.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}main{padding:30px 0}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="/"><img class="logo-img" src="/assets/logo.png" alt="TN'zone"></a><a href="/catalogo.html">← Catálogo</a></div></header>
<main><div class="wrap">
<div id="loading">Carregando produto…</div>
<div id="app" class="layout hidden">
<section class="box" id="singleBox">
  <h1>Seu pedido</h1>
  <div id="product" class="product"></div>
  <label>Quantidade</label><input id="quantity" type="number" min="1" max="20" value="1">
  <div class="row"><div><label>Tamanho</label><input id="size" placeholder="Ex.: 39"></div><div><label>Cor</label><input id="color" placeholder="Ex.: Preto"></div></div>
  <div style="margin-top:22px">Total: <span id="total" class="price"></span></div>
</section>
<section class="box hidden" id="cartBox">
  <h1>Seu carrinho</h1>
  <div id="cartItems"></div>
  <div style="margin-top:22px">Total: <span id="cartTotal" class="price"></span></div>
</section>
<section class="box">
  <h2>Seus dados</h2>
  <form id="form">
    <label>Nome completo</label><input id="name" autocomplete="name" required>
    <label>CPF</label><input id="cpf" inputmode="numeric" autocomplete="off" required>
    <label>E-mail</label><input id="email" type="email" autocomplete="email" required>
    <label>Telefone / WhatsApp</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="(99) 99999-9999" required>
    <label>Recado ou observação</label><textarea id="additionalData" placeholder="Endereço, recado, o que quiser avisar"></textarea>
    <button id="pay">GERAR PAGAMENTO PIX</button>
  </form>
  <div id="error" class="msg"></div>
</section>
</div>

<section id="payment" class="box pix hidden" style="margin-top:32px" aria-live="polite">
  <div id="paymentStatus" class="status">Aguardando pagamento…</div>
  <div id="pixArea">
    <p>Escaneie o QR Code ou use o Pix Copia e Cola.</p>
    <img id="qr" alt="QR Code Pix">
    <div id="expiry" style="color:var(--mute);font-size:.85rem"></div>
    <textarea id="pixCode" class="copy" readonly></textarea>
    <button id="copy" type="button">COPIAR PIX</button>
  </div>
  <div id="paid" class="msg success">Pagamento confirmado! Seu pedido está garantido. ❤️</div>
  <div id="failed" class="msg" style="background:#fdf2f2;border:1px solid #e8c4c4;color:#8a1f1f"></div>
  <button id="retry" type="button" class="hidden">GERAR UM NOVO PIX</button>
  <div style="margin-top:14px;font-size:.78rem;color:var(--mute)">Pedido <span id="orderRef"></span> — guarde esta página para consultar o status depois.</div>
</section>
</div></main>
<script src="/js/mock-api.js"></script>
<script src="/js/shop.js"></script>
<script>
(function(){
'use strict';
const qs=new URLSearchParams(location.search), slug=qs.get('produto')||qs.get('slug');
const cartMode = qs.get('modo')==='carrinho';
const resumeId = qs.get('pedido');
const $=id=>document.getElementById(id);
let product=null, order=null, timer=null, expiryTimer=null;
const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const TOKEN_KEY='tnzone-checkout-token';
// Token por tentativa de checkout: se a requisição for reenviada (duplo clique, rede instável),
// o servidor devolve o mesmo pedido em vez de gerar outra cobrança. Renovado após erro.
function checkoutToken(){let t=sessionStorage.getItem(TOKEN_KEY);if(!t){t=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(16)+Math.random().toString(16).slice(2)+Math.random().toString(16).slice(2));sessionStorage.setItem(TOKEN_KEY,t)}return t}
function resetToken(){sessionStorage.removeItem(TOKEN_KEY)}
function showError(msg){$('error').textContent=msg;$('error').style.display='block'}
function price(){return Number(product.promo_price!=null?product.promo_price:product.price)}
function render(){
  const img=product.images&&product.images[0]?'<img src="'+product.images[0]+'" alt="">':'<div style="width:100px;height:100px;background:#f2f2ef"></div>';
  $('product').innerHTML=img+'<div><strong>'+product.name+'</strong><div>'+money(price())+'</div><small>Estoque: '+product.stock+'</small></div>';
  updateTotal(); $('app').classList.remove('hidden'); $('loading').classList.add('hidden');
}
function updateTotal(){const q=Math.max(1,Math.min(20,Number($('quantity').value)||1));$('quantity').value=q;$('total').textContent=money(price()*q)}
$('quantity').addEventListener('input',updateTotal);
async function load(){
  if(!slug){$('loading').textContent='Nenhum produto escolhido.';return}
  try{const r=await fetch('/api/products/'+encodeURIComponent(slug));const d=await r.json();if(!r.ok)throw new Error(d.error);product=d.product;
    const qQty=Number(qs.get('quantity'));if(qQty>0)$('quantity').value=Math.min(20,qQty);
    if(qs.get('size'))$('size').value=qs.get('size');
    if(qs.get('color'))$('color').value=qs.get('color');
    render()}
  catch(e){$('loading').textContent=e.message||'Não deu pra carregar o produto.'}
}
function cartItemHtml(it){
  const img=it.image?'<img src="'+it.image+'" alt="">':'<div style="width:64px;height:64px;background:#f2f2ef"></div>';
  const meta=[it.size?'Tam. '+it.size:null,it.color||null].filter(Boolean).join(' · ');
  return '<div class="cart-item">'+img+'<div><strong>'+it.name+'</strong> × '+it.quantity+(meta?'<br><small>'+meta+'</small>':'')+'</div><div style="margin-left:auto">'+money(it.price*it.quantity)+'</div></div>';
}
function loadCart(){
  const cart=RSShop.getCart();
  if(!cart.length){$('loading').textContent='Seu carrinho está vazio.';return}
  $('cartItems').innerHTML=cart.map(cartItemHtml).join('');
  $('cartTotal').textContent=money(RSShop.cartSubtotal(cart));
  $('singleBox').classList.add('hidden');$('cartBox').classList.remove('hidden');
  $('app').classList.remove('hidden');$('loading').classList.add('hidden');
}

// ---- Painel de pagamento: tudo vem do servidor (dados reais da PromissePay) ----
function stopTimers(){if(timer){clearInterval(timer);timer=null}if(expiryTimer){clearInterval(expiryTimer);expiryTimer=null}}
function showExpiry(expiresAt){
  if(expiryTimer)clearInterval(expiryTimer);
  if(!expiresAt){$('expiry').textContent='';return}
  const end=new Date(expiresAt).getTime();
  const tick=()=>{const left=Math.max(0,Math.floor((end-Date.now())/1000));
    $('expiry').textContent=left>0?'Este PIX expira em '+String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0'):''};
  tick();expiryTimer=setInterval(tick,1000);
}
function applyOrder(d){
  order=d;
  $('orderRef').textContent='#'+String(d.id).slice(0,8);
  $('paid').style.display='none';$('failed').style.display='none';$('retry').classList.add('hidden');
  if(d.status==='PAID'){
    stopTimers();$('pixArea').classList.add('hidden');
    $('paymentStatus').textContent='Pagamento aprovado';$('paid').style.display='block';resetToken();return;
  }
  if(d.status==='PENDING'&&d.pix){
    $('pixArea').classList.remove('hidden');
    $('paymentStatus').textContent='Aguardando pagamento…';
    $('qr').src=d.pix.qrCodeBase64;$('pixCode').value=d.pix.qrCode;showExpiry(d.pix.expiresAt);return;
  }
  // EXPIRED / FAILED / ERROR / CANCELED: sem QR, com opção de gerar outro.
  stopTimers();$('pixArea').classList.add('hidden');
  const labels={EXPIRED:['PIX expirado','O tempo para pagar este PIX acabou. Nenhum valor foi cobrado.'],
    FAILED:['Pagamento não concluído','O pagamento foi recusado ou expirou sem ser pago. Nenhum valor foi cobrado.'],
    ERROR:['Erro no pagamento','Não foi possível concluir este pedido. Nenhum valor foi cobrado.']};
  const l=labels[d.status]||['Pagamento não concluído','Este pedido não está mais aguardando pagamento.'];
  $('paymentStatus').textContent=l[0];$('failed').textContent=l[1];$('failed').style.display='block';
  $('retry').classList.remove('hidden');resetToken();
}
function openPayment(d){
  $('payment').classList.remove('hidden');
  applyOrder(d);
  history.replaceState(null,'','?pedido='+encodeURIComponent(d.id));
  if(d.status==='PENDING')startPolling();
}
// O navegador só consulta; quem decide o status é o servidor (webhook + confirmação na API do gateway).
function startPolling(){
  if(timer)clearInterval(timer);
  const check=async()=>{try{
    const r=await fetch('/api/payments/orders/'+encodeURIComponent(order.id));
    const d=await r.json();if(!r.ok)return;applyOrder(d);
  }catch(e){}};
  timer=setInterval(check,5000);
}
$('retry').addEventListener('click',()=>{
  stopTimers();resetToken();$('payment').classList.add('hidden');
  history.replaceState(null,'',location.pathname+(cartMode?'?modo=carrinho':(slug?'?produto='+encodeURIComponent(slug):'')));
  if(!resumeId){window.scrollTo({top:0,behavior:'smooth'})}else{location.href='/catalogo.html'}
});
$('form').addEventListener('submit',async e=>{
 e.preventDefault();$('pay').disabled=true;$('pay').textContent='CRIANDO COBRANÇA…';$('error').style.display='none';
 try{
  let r,d;
  const common={name:$('name').value,cpf:$('cpf').value,email:$('email').value,phone:$('phone').value,additionalData:$('additionalData').value,checkoutToken:checkoutToken()};
  if(cartMode){
   const items=RSShop.getCart().map(it=>({productId:it.productId,quantity:it.quantity,size:it.size,color:it.color}));
   r=await fetch('/api/payments/pix/create-cart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({items},common))});
   d=await r.json();if(!r.ok)throw new Error(d.error||'Não deu pra gerar o pagamento. Tente de novo');
   RSShop.clearCart();
  } else {
   r=await fetch('/api/payments/pix/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({productId:product.id,quantity:Number($('quantity').value),size:$('size').value,color:$('color').value},common))});
   d=await r.json();if(!r.ok)throw new Error(d.error||'Não deu pra gerar o pagamento. Tente de novo');
  }
  openPayment(d);
 }catch(err){resetToken();showError(err.message)}
 finally{$('pay').disabled=false;$('pay').textContent='GERAR PAGAMENTO PIX'}
});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('pixCode').value);$('copy').textContent='PIX COPIADO ✓';setTimeout(()=>$('copy').textContent='COPIAR PIX',1800)}catch(e){$('pixCode').select()}});

// Voltou à página (ou abriu o link do pedido): mostra o estado real consultado no servidor.
async function resume(){
  try{
    const r=await fetch('/api/payments/orders/'+encodeURIComponent(resumeId));const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Pedido não encontrado.');
    $('loading').classList.add('hidden');openPayment(d);
  }catch(e){$('loading').textContent=e.message||'Não deu pra consultar o pedido.'}
}
if(resumeId){resume();}else if(cartMode){loadCart();}else{load();}
})();
</script>
</body>
</html>
